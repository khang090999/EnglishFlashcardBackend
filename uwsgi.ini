# uWSGI config for all envs.
# This file may be used for starting prod-like environment on local env
# usage:
#     uwsgi --ini uwsgi.ini --chdir=`pwd`
#
# do not forget to collect static files
[uwsgi]
http-socket    = :8080
chmod-socket   = 666
# no need to switch to the dir
# as buildpack has this as a home directory for the process anyway
# chdir          = /workspace/app
module         = config.wsgi:application
static-map     = /static=static

master          = true
processes       = 4
offload-threads = 4
vacuum          = true
harakiri        = 30
max-requests    = 10000
stats           = :9191
py-tracebacker  = /tmp/tracebacks.sock

memory-report   = true
enable-threads  = true
logger 	        = internalservererror file:/tmp/uwsgi-errors.log

# Routing config
route-uri = ^/static donotlog:
route-uri = ^/static/ addheader:Cache-Control: public,max-age=31536000,immutable addheader:X-Served-By: nginx+uwsgi
route-uri = ^/ addheader:X-Debug-RealIP: ${HTTP_X_REAL_IP}
route-uri = ^/ addheader:X-Debug-XFF: ${HTTP_X_FORWARDED_FOR}
env       = POD_NAMESPACE
env       = POD_NAME
env       = POD_IP
route-uri = ^/ addheader:X-Pod-Name: $(POD_NAME)
route-uri = ^/ addheader:X-Pod-Namespace: $(POD_NAMESPACE)
route-uri = ^/ addheader:X-Pod-IP: $(POD_IP)

# JSON access log with key fields (safe to index in Loki)
# https://uwsgi-docs.readthedocs.io/en/latest/LogFormat.html
# log-format = {
#   "time_local"             : "%(ltime)",
#   "protocol"               : "%(proto)",
#   "http_host"              : "%(host)",
#   "remote_addr"            : "%(var.HTTP_X_REAL_IP)",
#   "http_x_forwarded_for"   : "%(var.HTTP_X_FORWARDED_FOR)",
#   "http_x_forwarded_scheme": "%(var.HTTP_X_FORWARDED_SCHEME)",
#   "http_x_forwarded_proto" : "%(var.HTTP_X_FORWARDED_PROTO)",
#   "http_x_forwarded_host"  : "%(var.HTTP_X_FORWARDED_HOST)",
#   "request_id"             : "%(var.HTTP_X_REQUEST_ID)",
#   "request_method"         : "%(method)",
#   "request_uri"            : "%(uri)",
#   "args"                   : "%(query_string)",
#   "server_protocol"        : "%(proto)",
#   "status"                 : %(status),
#   "request"                : "%(method) %(uri) %(proto)",
#   "body_bytes_sent"        : %(size),
#   "request_time"           : "%(secs)",
#   "request_time_msec"      : "%(msecs)",
#   "pid"                    : %(pid),
#   "wid"                    : %(wid),
#   "core"                   : %(core),
#   "vsz"                    : %(vszM),
#   "rss"                    : %(rssM),
#   "ioerr"                  : %(ioerr),
#   "http_referer"           : "%(referer)",
#   "http_user_agent"        : "%(uagent)",
#   "http_x_trace"           : "%(var.HTTP_X_TRACE)"
# }
log-format = {"time_local":"%(ltime)","protocol":"%(proto)","http_host":"%(host)","remote_addr":"%(var.HTTP_X_REAL_IP)","http_x_forwarded_for":"%(var.HTTP_X_FORWARDED_FOR)","http_x_forwarded_scheme":"%(var.HTTP_X_FORWARDED_SCHEME)","http_x_forwarded_proto":"%(var.HTTP_X_FORWARDED_PROTO)","http_x_forwarded_host":"%(var.HTTP_X_FORWARDED_HOST)","request_id":"%(var.HTTP_X_REQUEST_ID)","request_method":"%(method)","request_uri":"%(uri)","args":"%(query_string)","server_protocol":"%(proto)","status":%(status), "request":"%(method) %(uri) %(proto)","body_bytes_sent":%(size),"request_time":"%(secs)","request_time_msec":"%(msecs)","pid":%(pid),"wid":%(wid),"core":%(core),"vsz":"%(vszM)","rss":"%(rssM)","ioerr":"%(ioerr)","http_referer":"%(referer)","http_user_agent":"%(uagent)","http_x_trace":"%(var.HTTP_X_TRACE)"}
ignore-sigpipe          = true
ignore-write-errors     = true
disable-write-exception = true
catch-exceptions        = true
log-slow                = 500
log-4xx                 = true
log-5xx                 = true
log-ioerror             = true
log-big                 = true

# auto-reading of POST content
# required when client sent HTTP POST request, but body
# won't read by app as he does not have permission for
# this action
post-buffering = 1

# max request headers size
# i.e. how long URL may be
buffer-size = 16383

# this is default uid/gid for cnb user that we used inside
# the buildpack
uid            = 1002
gid            = 1000

# Graceful reload
touch-reload = uwsgi-reload
master-fifo = uwsgi-fifo
